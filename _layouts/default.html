<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>{{ site.title }}</h1>
            <p>{{ site.description }}</p>
        </header>

        <nav>
            <ul>
                <li><a href="{{ '/' | relative_url }}">خانه</a></li>
                <li><a href="{{ '/about' | relative_url }}">درباره من</a></li>
                <li><a href="{{ '/blog' | relative_url }}">بلاگ</a></li>
            </ul>
        </nav>

        <main>
            {{ content }}
        </main>

        <footer>
            <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author }} | تمامی حقوق محفوظ است</p>
        </footer>
    </div>
</body>
</html>
